version: "3.9"

services:
  backend:
    image: zabbix-netbox-unified-backend
    container_name: zneditor-backend
    env_file:
      - .env
    environment:
      ZNEDITOR_DEPLOY_MARKER: zabbix-search-macro-drawio-v1
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - default
      - observium
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zneditor-frontend
    ports:
      - "8000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: zneditor-net
  observium:
    external: true
    name: observium_default
